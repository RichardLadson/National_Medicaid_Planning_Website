[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."sherene-gate"]
  # Views dashboard login, view tracking and password reset for /sherene; the page itself is public static.

[[redirects]]
  from = "/sherene/presentation/*"
  to = "/sherene/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/site-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/richard/stats-data"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sherene/stats-data"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/andrea/stats-data"
  [headers.values]
    Cache-Control = "no-store"
